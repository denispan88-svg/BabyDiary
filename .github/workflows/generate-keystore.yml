name: Generate Keystore

on:
  workflow_dispatch: # Запуск только вручную кнопкой

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          # Генерируем ключ с жестко заданными паролями
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias baby \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BabyDiary2026 \
            -keypass BabyDiary2026 \
            -dname "CN=BabyDiary, OU=Dev, O=Personal, L=Moscow, S=Moscow, C=RU"
          
          # Переводим в Base64
          base64 -w0 release.keystore > keystore.txt
          
          # Выводим результат в окно "Summary", чтобы вам было удобно копировать
          echo "### Keystore успешно сгенерирован! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "Скопируйте текст ниже (нажмите на значок копирования в правом верхнем углу блока) и вставьте его в секрет \`KEYSTORE_BASE64\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat keystore.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
