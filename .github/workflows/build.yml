name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon-192.png www/ 2>/dev/null || true
          cp icon-512.png www/ 2>/dev/null || true

      - name: Read version from index.html
        id: ver
        run: |
          V=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" index.html | head -1)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Inject Build Tag
        run: |
          TAG="v${{ steps.ver.outputs.version }}-${{ github.run_number }}"
          sed -i "s/const BUILD_TAG = '.*';/const BUILD_TAG = '$TAG';/" www/index.html
          echo "Внедрен тег сборки: $TAG"

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/preferences @capacitor/app @capacitor/filesystem

      - name: Init Capacitor
        run: npx cap init "Дневник развития" "com.babydiary.app" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin version conflict
        run: |
          cat >> android/build.gradle << 'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
              }
            }
          }
          EOF

      - name: Copy web files
        run: npx cap copy

      - name: Sync Capacitor
        run: npx cap sync

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/babydiary.keystore

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/babydiary.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/BabyDiary.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: babydiary-apk
          path: release/BabyDiary.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: Дневник развития v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          files: release/BabyDiary.apk
          draft: false
          prerelease: false