<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Дневник развития • Планер мамы</title>
<style>
:root{
  --pink:#f7a5c2; --pink-soft:#fde3ed; --purple:#b39ddb; --purple-soft:#ede7f6;
  --mint:#8fd0c2; --mint-soft:#e0f3ee;
  --text:#463a49; --text-light:#8d8091; --card:#fff;
  --border:#f1e6ee; --shadow:0 6px 24px rgba(180,150,180,.09);
  --ok:#5fbf9b; --fail:#e88a8a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(180deg,#fdf8fa 0%,#f7f2fb 100%);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app{max-width:760px;margin:0 auto;padding:16px}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:4px 6px;gap:12px}
.header-info{min-width:0;flex:1}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .sub{font-size:12px;color:var(--text-light);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;
  box-shadow:0 4px 14px rgba(200,150,200,.35);overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#fff;border-top:1px solid var(--border);
  box-shadow:0 -4px 24px rgba(180,150,180,.13);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.bottom-nav-inner{display:flex;gap:2px;max-width:760px;margin:0 auto}
.tab{flex:1;min-width:0;padding:8px 2px;border-radius:12px;border:none;background:transparent;
  font-family:inherit;font-size:10.5px;font-weight:600;color:var(--text-light);cursor:pointer;
  transition:.2s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ti{font-size:18px;line-height:1}
.tab.active{background:linear-gradient(135deg,var(--pink-soft),var(--purple-soft));color:var(--text)}

.card{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--text-light);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.focus-card{background:linear-gradient(135deg,#fff0f6 0%,#efe7ff 100%);border-radius:20px;
  padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.focus-card::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);border-radius:50%}
.fw{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#b07c9c;margin-bottom:4px}
.ft{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px;position:relative}
.fd{font-size:13px;color:#8a6e85;position:relative}
button{font-family:inherit}
.btn{border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
  box-shadow:0 4px 14px rgba(200,140,200,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--pink-soft);color:#a5668e}
.btn-ghost:active{background:#f9cfe0}
.btn-mini{padding:6px 10px;font-size:12px;border-radius:9px}
input,textarea,select{font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:11px;
  padding:9px 12px;background:#fdfbfc;color:var(--text);outline:none;width:100%;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--pink);background:#fff}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:8px;align-items:center}
.task{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;
  margin-bottom:9px;transition:.2s;position:relative;overflow:hidden}
.task.done{background:#f3fbf7;border-color:#cdeadd}
.task.failed{background:#fdf3f3;border-color:#f1d4d4;opacity:.85}
.task.pending{border-left:4px solid var(--pink)}
.task.done::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.task.failed::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fail)}
.t-head{display:flex;gap:10px;align-items:flex-start}
.t-check{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--pink);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--pink);transition:.15s;padding:0;line-height:1}
.t-check:hover{background:var(--pink-soft)}
.t-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.t-check.failed{background:var(--fail);border-color:var(--fail);color:#fff;cursor:not-allowed}
.t-info{flex:1;min-width:0}
.t-name{font-weight:600;font-size:14.5px;line-height:1.35}
.task.done .t-name{color:#4e8a72}
.task.failed .t-name{color:#a86d6d;text-decoration:line-through;text-decoration-color:#d49a9a}
.t-meta{font-size:12px;color:var(--text-light);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
.t-badge{display:inline-block;background:var(--purple-soft);color:#7a6ba8;border-radius:6px;
  padding:1px 7px;font-size:11px;font-weight:600}
.t-badge.time{background:var(--mint-soft);color:#4a8b7e}
.t-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.t-controls input{font-size:12.5px;padding:7px 9px}
.t-controls .full{grid-column:1/-1}
.t-link{background:none;border:none;color:#a17bb8;font-size:12px;cursor:pointer;
  padding:2px 0;font-weight:600}
.t-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.datebar{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;
  padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.datebar input[type=date]{flex:1;border:none;background:transparent;padding:0;font-weight:600;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:#faf6fb;border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:22px;font-weight:700;color:var(--text)}
.stat.ok .n{color:var(--ok)} .stat.fail .n{color:var(--fail)}
.stat .l{font-size:11px;color:var(--text-light);margin-top:2px}
.note{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.note-time{font-size:11.5px;color:var(--text-light);font-weight:600}
.note-link{font-size:11px;background:var(--pink-soft);color:#a5668e;padding:3px 8px;border-radius:7px;font-weight:600}
.note-text{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.note-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.note-photos img{width:76px;height:76px;object-fit:cover;border-radius:10px;cursor:pointer}
.del{background:none;border:none;color:#c9a8b5;font-size:16px;cursor:pointer;padding:0 4px}
.photo-up{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-prev{position:relative}
.photo-prev img{width:70px;height:70px;object-fit:cover;border-radius:10px}
.photo-prev button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:#e88a8a;color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1}
.up-label{display:inline-flex;align-items:center;gap:6px;background:var(--pink-soft);color:#a5668e;
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer}
.up-label input{display:none}
.ach{background:linear-gradient(135deg,#fff9f0,#fef4fa);border-radius:16px;padding:14px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.ach-title{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.ach-date{font-size:12px;color:var(--text-light)}
.ach img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px;cursor:pointer}
.ritual{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ritual-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ritual-name{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.period{font-size:11px;background:var(--mint-soft);color:#4a8b7e;padding:3px 8px;border-radius:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f7f0f5}
.step:last-child{border-bottom:none}
.step-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--purple);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;flex-shrink:0;padding:0;transition:.15s}
.step-check.on{background:var(--purple);border-color:var(--purple)}
.step-text{font-size:14px;flex:1}
.step.on .step-text{color:var(--text-light);text-decoration:line-through}
.add-form{background:#fbf7fd;border:1.5px dashed #e0d3ec;border-radius:14px;padding:12px;margin-top:8px}
.add-form .row{margin-bottom:8px}
.hint{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.4}
.empty{text-align:center;padding:34px 20px;color:var(--text-light)}
.empty .e{font-size:42px;margin-bottom:10px;opacity:.7}
.modal{position:fixed;inset:0;background:rgba(70,50,70,.55);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-inner{background:#fff;border-radius:20px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
.modal-inner h3{font-size:17px;margin-bottom:14px}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;
  justify-content:center;z-index:200;padding:20px;cursor:zoom-out}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#463a49;color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;
  font-weight:600;transition:.3s;z-index:300;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
code{background:#f5eefa;color:#7a6ba8;padding:2px 6px;border-radius:5px;font-size:12.5px}
.prev-item{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#faf7fc;
  border-radius:8px;margin-bottom:5px;font-size:12.5px}
.prev-item b{color:#7a6ba8}
.prev-focus{background:#eaf7f1;color:#3f7d6b;border-radius:8px;padding:6px 10px;
  margin-bottom:5px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.prev-focus b{color:#3f7d6b}

/* Avatar edit */
.avatar-edit{width:92px;height:92px;border-radius:50%;margin:0 auto;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:46px;cursor:pointer;
  box-shadow:0 6px 20px rgba(200,150,200,.4);overflow:hidden;transition:.15s}
.avatar-edit:hover{transform:scale(1.03)}
.avatar-edit img{width:100%;height:100%;object-fit:cover}
.field-label{font-size:13px;font-weight:600;color:#8d8091;display:block;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-info">
      <h1 id="childName">Малыш</h1>
      <div class="sub" id="headerSub">Загрузка…</div>
    </div>
    <div class="avatar" id="avatarBtn" title="Настройки">
      <span id="avatarEmoji">👶</span>
      <img id="avatarImg" alt="" style="display:none">
    </div>
  </header>

  <main id="main"></main>
</div>

<!-- нижняя навигация -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner" id="tabs">
    <button class="tab active" data-tab="tasks"><span class="ti">📋</span>Занятия</button>
    <button class="tab" data-tab="notes"><span class="ti">📝</span>Заметки</button>
    <button class="tab" data-tab="achieve"><span class="ti">🏆</span>Достижения</button>
    <button class="tab" data-tab="rituals"><span class="ti">🌙</span>Ритуалы</button>
    <button class="tab" data-tab="food"><span class="ti">🍼</span>Прикорм</button>
  </div>
</nav>

<!-- модалка: настройки -->
<div class="modal" id="settingsModal">
  <div class="modal-inner">
    <h3 id="settingsTitle">Настройки</h3>

    <div class="avatar-edit" id="avatarEdit" title="Нажмите, чтобы выбрать фото">
      <span id="avatarPreviewEmoji">👶</span>
      <img id="avatarPreview" style="display:none" alt="">
    </div>
    <input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="App.loadAvatar(this)">
    <div class="row" style="justify-content:center;gap:8px;margin:10px 0 16px">
      <button class="btn btn-mini btn-ghost" onclick="document.getElementById('avatarFile').click()">📷 Фото</button>
      <button class="btn btn-mini btn-ghost" onclick="App.clearAvatar()">🗑 Убрать</button>
    </div>

    <label class="field-label">Имя ребёнка</label>
    <input type="text" id="setName" placeholder="Например: Алиса" style="margin-bottom:14px">

    <label class="field-label">Имя мамы</label>
    <input type="text" id="setMother" placeholder="Например: Оля" style="margin-bottom:14px">

    <label class="field-label">Дата рождения</label>
    <input type="date" id="setBirth" style="margin-bottom:14px">
    <p class="hint">От даты рождения рассчитывается номер недели.</p>

    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn btn-mini btn-ghost" onclick="App.resetAll()">🗑 Сбросить всё</button>
      <button class="btn btn-primary" onclick="App.saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<!-- модалка: импорт -->
<div class="modal" id="importModal">
  <div class="modal-inner">
    <h3>📥 Импорт плана из txt</h3>
    <p class="hint" style="margin-bottom:10px">
      Задача: <code>ДД.ММ.ГГГГ: Название (Цель)</code><br>
      Фокус: строка <code>Фокус: текст</code> — задаёт фокус для последующих дат.
    </p>
    <label class="up-label">📄 Выбрать .txt файл
      <input type="file" accept=".txt,text/plain" onchange="App.loadImportFile(this)">
    </label>
    <div class="hint" style="margin-top:12px;margin-bottom:6px">…или вставьте текст вручную:</div>
    <textarea id="importText" rows="8" placeholder="Фокус: Развитие слуха и гуления
12.05.2024: Выкладывание на живот (5 мин)
12.05.2024: Массаж всего тела (10 мин)
13.05.2024: Погремушка справа/слева (10 повторений)

Фокус: Развитие зрения
19.05.2024: Слежение за игрушкой (10 раз)" oninput="App.previewImport()"></textarea>
    <div id="importPreview" style="margin-top:10px"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer;color:#8d8091">
      <input type="checkbox" id="importClearFocus" style="width:auto">
      <span>Очистить старые фокусы недель перед импортом</span>
    </label>
    <div class="row" style="justify-content:space-between;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-mini btn-ghost" onclick="App.closeImport()">Отмена</button>
      <div style="display:flex;gap:6px">
        <button class="btn btn-mini btn-ghost" onclick="App.doImport('add')">➕ Добавить</button>
        <button class="btn btn-mini btn-primary" onclick="App.doImport('replace')">🔄 Заменить дни</button>
      </div>
    </div>
  </div>
</div>

<div id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
/* ============ УТИЛИТЫ ============ */
const APP_VERSION = '1.0.1';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const todayStr = (d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`};
const addDays = (s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d)};
const fmtDate = (s)=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})};
const fmtDMY = (s)=>{const [y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const esc = (s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function openImg(src){$('#lbImg').src=src;$('#lightbox').classList.add('show')}

function compressImage(file,max=900){return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=e=>{const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas');let{width:w,height:h}=img;
    if(w>h&&w>max){h*=max/w;w=max}else if(h>max){w*=max/h;h=max}
    cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    res(cv.toDataURL('image/jpeg',.72));
  };img.src=e.target.result};
  fr.readAsDataURL(file);
})}

/* ============ ФОКУСЫ ПО УМОЛЧАНИЮ ============ */
const WEEK_FOCUS={
1:{t:'Контакт и адаптация',e:'🤱',d:'Кожа к коже, спокойное бодрствование',tasks:[
  {n:'Контакт кожа-к-коже',g:'30 мин',ty:'time'},
  {n:'Зрительный контакт',g:'5 мин',ty:'time'},
  {n:'Спокойное бодрствование рядом',g:'10 мин',ty:'time'}]},
2:{t:'Слух',e:'👂',d:'Реакция на звуки, поворот головы',tasks:[
  {n:'Погремушка справа / слева',g:'10 повторений',ty:'count'},
  {n:'Тихая спокойная музыка',g:'15 мин',ty:'time'},
  {n:'Ласковый разговор',g:'20 мин',ty:'time'},
  {n:'Пение колыбельной',g:'2 раза',ty:'count'}]},
3:{t:'Зрение',e:'👀',d:'Фокусировка, слежение',tasks:[
  {n:'Контрастные картинки',g:'5 мин',ty:'time'},
  {n:'Слежение за игрушкой',g:'10 повторений',ty:'count'},
  {n:'Мобиль / Подвесные игрушки',g:'10 мин',ty:'time'},
  {n:'Слежение за лицом мамы',g:'5 мин',ty:'time'}]},
4:{t:'Моторика и рефлексы',e:'✋',d:'Выкладывание на живот',tasks:[
  {n:'Выкладывание на живот',g:'3×2 мин',ty:'count'},
  {n:'Захват пальца взрослого',g:'10 повторений',ty:'count'},
  {n:'Массаж ручек и ножек',g:'5 мин',ty:'time'},
  {n:'Гимнастика',g:'5 мин',ty:'time'}]},
5:{t:'Тактильные ощущения',e:'🖐️',d:'Разные текстуры',tasks:[
  {n:'Поглаживание разными тканями',g:'5 мин',ty:'time'},
  {n:'Массаж пальчиков',g:'5 мин',ty:'time'},
  {n:'Воздушные ванны',g:'10 мин',ty:'time'},
  {n:'Выкладывание на живот',g:'3×3 мин',ty:'count'}]},
6:{t:'Речь и гуление',e:'🗣️',d:'Звуки, гуление',tasks:[

function safeParse(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    if(!raw) return fallback;
    const v=JSON.parse(raw);
    return v==null?fallback:v;
  }catch(e){return fallback}
}

  name: localStorage.getItem(LS.name)||'Малыш',

  tasks: safeParse(LS.tasks,{}),

  ach: safeParse(LS.ach,[]),

if(!Array.isArray(state.notes)) state.notes=[];
if(!Array.isArray(state.ach)) state.ach=[];
if(!Array.isArray(state.rituals)) state.rituals=[];

function save(k){
  const v=state[k];
  if(typeof v==='string') localStorage.setItem(LS[k], v);
  else localStorage.setItem(LS[k], JSON.stringify(v));
}

/* ============ НЕДЕЛЯ ============ */
function getWeekNum(dateStr){
  if(!state.birth) return 1;
  const b=new Date(state.birth+'T00:00:00');
  const d=new Date(dateStr+'T00:00:00');
  const diff=Math.floor((d-b)/86400000);
  return Math.max(1,Math.floor(diff/7)+1);
}
function getMonday(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();
  const diff=(dow===0)?-6:(1-dow);
  d.setDate(d.getDate()+diff);
  return todayStr(d);
}

function getFocus(dateStr){
  const wn=getWeekNum(dateStr);
  const mk=getMonday(dateStr);
  const imported=state.weekFocus[mk];
  if(imported && imported.trim()){
    return {week:wn, t:imported, e:'📥', d:'Фокус недели из импорта'};
  }
  return Object.assign({week:wn}, WEEK_FOCUS[wn]||DEFAULT_FOCUS);
}

function ensureTasksFor(date){
  if(state.tasks[date]) return;
  const focus=getFocus(date);
  state.tasks[date]=focus.tasks.map(t=>({
    id:'t'+uid(), name:t.n, target:t.g, type:t.ty,
    reps:'', time:'', note:'', status:null
  }));
  save('tasks');
}

function finalizePastTasks(){
  const today=todayStr();
  let changed=false;
  for(const date in state.tasks){
    if(date<today){
      state.tasks[date].forEach(t=>{
        if(!t.status){t.status='failed';changed=true}
      });
    }
  }
  if(changed) save('tasks');
}

/* ============ ПАРСЕР TXT ============ */
function parsePlanText(text){
  const map={}, weekFocus={}, errors=[];
  const lines=String(text||'').split(/\r?\n/);
  let currentFocus=null;
  const focusRe=/^\s*фокус(?:\s+недели)?\s*[:\-—–]\s*(.+?)\s*$/i;
  const dateRe=/^\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})\s*[:\-—–]\s*(.+?)\s*$/;

  lines.forEach((line,idx)=>{
    const raw=line.trim();
    if(!raw || raw.startsWith('#')) return;

    const fm=raw.match(focusRe);
    if(fm){
      currentFocus=fm[1].trim()||null;
      return;
    }

    const m=raw.match(dateRe);
    if(!m){ errors.push({line:idx+1, text:raw}); return; }
    let [,d,mo,y,rest]=m;
    if(y.length===2) y='20'+y;
    const dd=String(+d).padStart(2,'0');
    const mm=String(+mo).padStart(2,'0');
    if(+dd<1||+dd>31||+mm<1||+mm>12){ errors.push({line:idx+1, text:raw}); return; }
    const date=`${y}-${mm}-${dd}`;
    let name=rest.trim(), target='—';
    const pm=rest.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if(pm){ name=pm[1].trim(); target=pm[2].trim(); }
    if(!name){ errors.push({line:idx+1, text:raw}); return; }
    if(!map[date]) map[date]=[];
    map[date].push({name, target, type:/мин|час/i.test(target)?'time':'count'});

    if(currentFocus) weekFocus[getMonday(date)]=currentFocus;
  });

  return {map, weekFocus, errors};
}

    +'<button class="btn btn-mini btn-primary" onclick="App.addTask()">Добавить</button>'
    +'</div></div>';
}

function getWeekStats(dateStr){
  const w=getWeekNum(dateStr);
  let done=0,failed=0,total=0;
  for(const date in state.tasks){
    if(getWeekNum(date)!==w) continue;
    state.tasks[date].forEach(t=>{
      total++;
      if(t.status==='done') done++;
      else if(t.status==='failed') failed++;
    });
  }
  return {done,failed,total};
}

      main.innerHTML = renderTasks();

      main.innerHTML = renderNotes();
      renderNotePhotos();

      main.innerHTML = renderAch();

      main.innerHTML = renderRituals();

    $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.activeTab));
  }catch(err){
    console.error(err);
    $('#main').innerHTML='<div class="card"><div class="empty"><div class="e">⚠️</div>'
      +'<b>Ошибка:</b> '+esc(err.message)+'<br><br>'
      +'<button class="btn btn-mini btn-primary" onclick="App.resetAll()">Сбросить все данные</button>'
      +'</div></div>';
  }
}

/* ============ API ============ */
const App={
  switchTab(tab){
    state.activeTab=tab;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  },
  changeDate(d){ state.selectedDate=d; state.addTaskOpen=false; render(); },

  /* ---- задачи ---- */
  toggleDone(id){
    const list=state.tasks[state.selectedDate]; if(!list) return;
    const t=list.find(x=>x.id===id);
    if(!t||t.status==='failed') return;
    t.status = t.status==='done' ? null : 'done';
    save('tasks'); render();
  },
  updTask(id,field,val){
    const list=state.tasks[state.selectedDate]; if(!list) return;
    const t=list.find(x=>x.id===id); if(!t) return;
    t[field]=val; save('tasks');
  },
  delTask(id){
    if(!state.tasks[state.selectedDate]) return;
    state.tasks[state.selectedDate]=state.tasks[state.selectedDate].filter(x=>x.id!==id);
    save('tasks'); render();
  },
  toggleAdd(){ state.addTaskOpen=!state.addTaskOpen; render(); },
  pickFromPool(i){
    if(i==='') return;
    const p=POOL_TASKS[+i];
    const n=$('#newTaskName'), t=$('#newTaskTarget');
    if(n) n.value=p.n;
    if(t) t.value=p.g;
  },
  addTask(){
    const n=$('#newTaskName'), t=$('#newTaskTarget');
    const name=(n?n.value:'').trim();
    if(!name){ toast('Введите название'); return; }
    const target=(t?t.value:'').trim()||'—';
    ensureTasksFor(state.selectedDate);
    state.tasks[state.selectedDate].push({
      id:'t'+uid(), name, target,
      type:/мин|час/i.test(target)?'time':'count',
      reps:'', time:'', note:'', status:null
    });
    save('tasks'); state.addTaskOpen=false; render(); toast('Задача добавлена');
  },
  noteFromTask(id){
    const list=state.tasks[state.selectedDate]; if(!list) return;
    const t=list.find(x=>x.id===id); if(!t) return;
    state.activeTab='notes'; render();
    setTimeout(()=>{
      const ta=$('#noteText'); if(ta) ta.focus();
      const sel=$('#noteLink');
      if(sel){
        let opt=[...sel.options].find(o=>o.value===t.name);
        if(!opt){ opt=new Option(t.name,t.name); sel.add(opt); }
        sel.value=t.name;
      }
      toast('Заметка привязана к задаче');
    },60);
  },

  /* ---- ИМПОРТ ---- */
  openImport(){
    $('#importText').value='';
    $('#importPreview').innerHTML='';
    $('#importClearFocus').checked=false;
    $('#importModal').classList.add('show');
  },
  closeImport(){ $('#importModal').classList.remove('show'); },
  loadImportFile(input){
    const f=input.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=e=>{
      $('#importText').value=e.target.result;
      App.previewImport();
      toast('Файл загружен');
    };
    fr.readAsText(f,'UTF-8');
    input.value='';
  },
  previewImport(){
    const text=$('#importText').value;
    const {map,weekFocus,errors}=parsePlanText(text);
    const dates=Object.keys(map).sort();
    const total=dates.reduce((s,d)=>s+map[d].length,0);
    const focuses=Object.keys(weekFocus);
    const prev=$('#importPreview');
    if(!total && !focuses.length && !errors.length){ prev.innerHTML=''; return; }
    let html='';
    if(focuses.length){
      html+='<div style="font-size:12.5px;color:#3f7d6b;font-weight:700;margin-bottom:6px">'
        +'📥 Фокусы недель: '+focuses.length+'</div>';
      focuses.sort().forEach(mk=>{
        html+='<div class="prev-focus"><b>с '+fmtDMY(mk)+'</b><span>'+esc(weekFocus[mk])+'</span></div>';
      });
    }
    if(total){
      html+='<div style="font-size:12.5px;color:#7a6ba8;font-weight:700;margin-bottom:6px;margin-top:8px">'
        +'Задач: '+total+' на '+dates.length+' дн.</div>';
      dates.slice(0,4).forEach(d=>{
        html+='<div class="prev-item"><b>'+fmtDMY(d)+'</b><span>'+map[d].length+' задач</span></div>';
      });
      if(dates.length>4) html+='<div class="hint">…и ещё '+(dates.length-4)+' дн.</div>';
    }
    if(errors.length){
      html+='<div style="margin-top:8px;font-size:12px;color:#c86b6b">⚠ Пропущено строк: '+errors.length+'</div>';
    }
    prev.innerHTML=html;
  },
  doImport(mode){
    const text=$('#importText').value;
    const {map,weekFocus}=parsePlanText(text);
    const dates=Object.keys(map);
    const focuses=Object.keys(weekFocus);
    if(!dates.length && !focuses.length){ toast('Нет данных для импорта'); return; }
    if($('#importClearFocus').checked) state.weekFocus={};
    Object.assign(state.weekFocus, weekFocus);
    save('weekFocus');

    const today=todayStr();
    let addedTasks=0, changedDays=0;

    dates.forEach(date=>{
      const items=map[date];
      if(mode==='replace'){
        state.tasks[date]=items.map(t=>({
          id:'t'+uid(), name:t.name, target:t.target, type:t.type,
          reps:'', time:'', note:'', status: date<today?'failed':null
        }));
        changedDays++; addedTasks+=items.length;
      } else {
        if(!state.tasks[date]) state.tasks[date]=[];
        const room=Math.max(0, 20-state.tasks[date].length);
        items.slice(0,room).forEach(t=>{
          state.tasks[date].push({
            id:'t'+uid(), name:t.name, target:t.target, type:t.type,
            reps:'', time:'', note:'', status: date<today?'failed':null
          });
        });
        addedTasks+=Math.min(room, items.length);
        changedDays++;
      }
    });

    save('tasks');
    App.closeImport();
    render();
    let msg='Импортировано: '+addedTasks+' задач на '+changedDays+' дн.';
    if(focuses.length) msg+=' · фокусов: '+focuses.length;
    toast(msg);
  },

  /* ---- заметки ---- */
  async addNotePhoto(input){
    const files=[...input.files].slice(0,5);
    for(const f of files){
      const data=await compressImage(f);
      state.pendingPhotos.push(data);
    }
    input.value=''; renderNotePhotos();
  },
  saveNote(){
    const ta=$('#noteText');
    const text=ta?ta.value.trim():'';
    if(!text && !state.pendingPhotos.length){ toast('Добавьте текст или фото'); return; }
    const sel=$('#noteLink');
    state.notes.push({
      id:uid(), ts:Date.now(), text,
      taskName: sel?sel.value:'',
      photos: [...state.pendingPhotos]
    });
    state.pendingPhotos=[];
    save('notes'); render(); toast('Заметка сохранена ✨');
  },
  delNote(id){
    if(!confirm('Удалить заметку?')) return;
    state.notes=state.notes.filter(n=>n.id!==id);
    save('notes'); render();
  },

  /* ---- достижения ---- */
  async addAchPhoto(input){
    const f=input.files[0]; if(!f) return;
    state._achPhoto=await compressImage(f);
    input.value=''; renderAchPhoto();
  },
  saveAch(){
    const t=$('#achTitle'), d=$('#achDate');
    const title=t?t.value.trim():'';
    if(!title){ toast('Введите название'); return; }
    state.ach.push({
      id:uid(), title,
      date: (d&&d.value)||new Date().toISOString(),
      photo: state._achPhoto||''
    });
    state._achPhoto='';
    save('ach'); render(); toast('Достижение записано 🎉');
  },
  delAch(id){
    if(!confirm('Удалить достижение?')) return;
    state.ach=state.ach.filter(a=>a.id!==id);
    save('ach'); render();
  },

  /* ---- ритуалы ---- */
  toggleStep(rid,sid){
    const r=state.rituals.find(x=>x.id===rid); if(!r) return;
    const today=todayStr();
    if(!r.completions) r.completions={};
    if(!r.completions[today]) r.completions[today]={};
    r.completions[today][sid]=!r.completions[today][sid];
    save('rituals'); render();
  },
  addStep(rid){
    const inp=document.getElementById('stepInput_'+rid);
    const text=inp?inp.value.trim():'';
    if(!text) return;
    const r=state.rituals.find(x=>x.id===rid); if(!r) return;
    r.steps.push({id:uid(), text});
    save('rituals'); render();
  },
  delStep(rid,sid){
    const r=state.rituals.find(x=>x.id===rid); if(!r) return;
    r.steps=r.steps.filter(s=>s.id!==sid);
    save('rituals'); render();
  },
  delRitual(id){
    if(!confirm('Удалить ритуал?')) return;
    state.rituals=state.rituals.filter(r=>r.id!==id);
    save('rituals'); render();
  },
  addRitual(){
    const n=$('#ritName'), p=$('#ritPeriod');
    const name=n?n.value.trim():'';
    if(!name){ toast('Введите название'); return; }
    state.rituals.push({
      id:uid(), name, emoji:'✨',
      period: p?p.value:'daily',
      steps:[], completions:{}
    });
    save('rituals'); render(); toast('Ритуал создан');
  },

  /* ---- АВАТАР ---- */
  async loadAvatar(input){
    const f=input.files[0]; if(!f) return;
    state._newAvatar=await compressImage(f,320);
    input.value='';
    App._renderAvatarPreview();
  },
  clearAvatar(){
    state._newAvatar='';
    App._renderAvatarPreview();
  },
  _renderAvatarPreview(){
    const img=$('#avatarPreview'), emoji=$('#avatarPreviewEmoji');
    const src = (state._newAvatar!==undefined) ? state._newAvatar : state.avatar;
    if(src){
      img.src=src; img.style.display='block';
      emoji.style.display='none';
    } else {
      img.style.display='none';
      emoji.style.display='block';
    }
  },

  /* ---- НАСТРОЙКИ ---- */
  openSettings(firstTime){
    $('#setName').value = (state.name && state.name!=='Малыш') ? state.name : '';
    $('#setMother').value = state.motherName||'';
    $('#setBirth').value = state.birth||'';
    state._newAvatar = state.avatar||'';
    App._renderAvatarPreview();
    $('#settingsTitle').textContent = firstTime ? 'Добро пожаловать! 👋' : 'Настройки';
    $('#settingsModal').classList.add('show');
  },
  saveSettings(){
    state.name = $('#setName').value.trim() || 'Малыш';
    state.motherName = $('#setMother').value.trim();
    state.birth = $('#setBirth').value;
    state.avatar = state._newAvatar || '';
    save('name'); save('motherName'); save('birth'); save('avatar');
    localStorage.setItem(LS.onboarded,'1');
    $('#settingsModal').classList.remove('show');
    render();
    toast('Сохранено ✨');
  },
  resetAll(){
    if(!confirm('Удалить все данные приложения? Это необратимо.')) return;
    Object.values(LS).forEach(k=>localStorage.removeItem(k));
    location.reload();
  }
};
window.App=App;
window.openImg=openImg;

function renderNotePhotos(){
  const el=$('#notePhotoPreview'); if(!el) return;
  let html='';
  state.pendingPhotos.forEach((p,i)=>{
    html+='<div class="photo-prev"><img src="'+p+'"><button onclick="App._delNotePhoto('+i+')">✕</button></div>';
  });
  el.innerHTML=html;
}
App._delNotePhoto=(i)=>{ state.pendingPhotos.splice(i,1); renderNotePhotos(); };

function renderAchPhoto(){
  const el=$('#achPhotoPreview'); if(!el) return;
  el.innerHTML = state._achPhoto
    ? '<div class="photo-prev"><img src="'+state._achPhoto+'"><button onclick="App._delAchPhoto()">✕</button></div>'
    : '';
}
App._delAchPhoto=()=>{ state._achPhoto=''; renderAchPhoto(); };

/* ============ СОБЫТИЯ ============ */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');
  if(b) App.switchTab(b.dataset.tab);
});
$('#avatarBtn').addEventListener('click',()=>App.openSettings(false));
$('#avatarEdit').addEventListener('click',()=>$('#avatarFile').click());
$('#settingsModal').addEventListener('click',e=>{
  if(e.target.id==='settingsModal') e.target.classList.remove('show');
});
$('#importModal').addEventListener('click',e=>{
  if(e.target.id==='importModal') e.target.classList.remove('show');
});

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
(function init(){
  if(!state.rituals.length){
    state.rituals=[
      {id:uid(),name:'Ритуал сна',emoji:'🌙',period:'daily',steps:[
        {id:uid(),text:'Выключить свет'},
        {id:uid(),text:'Запеленать'},
        {id:uid(),text:'Покормить'},
        {id:uid(),text:'Подержать столбиком'},
        {id:uid(),text:'Прочесть сказку на ночь'},
        {id:uid(),text:'Открыть окно / проветрить'}
      ],completions:{}},
      {id:uid(),name:'Утренний ритуал',emoji:'☀️',period:'daily',steps:[
        {id:uid(),text:'Умывание'},
        {id:uid(),text:'Воздушные ванны 5 мин'},
        {id:uid(),text:'Лёгкий массаж'},
        {id:uid(),text:'Кормление'}
      ],completions:{}}
    ];
    save('rituals');
  }
  ensureTasksFor(todayStr());
  finalizePastTasks();
  render();

  // Онбординг — только при первом запуске
  if(!localStorage.getItem(LS.onboarded)){
    setTimeout(()=>App.openSettings(true), 300);
  }
})();
</script>
